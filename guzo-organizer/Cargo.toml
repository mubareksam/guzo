[package]
name = "guzo-organizer"
version = "1.0.0"
edition = "2021"
description = "Guzo Organizer — Fast, lightweight Windows file organizer (Rust + Tauri)"
authors = ["Qmer"]
license = "MIT"
repository = "https://github.com/mubareksam/guzo"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
regex = "1"
walkdir = "2"
rayon = "1.10"
sha2 = "0.10"
blake3 = "1"
strsim = "0.11"
chrono = { version = "0.4", features = ["serde"] }
infer = "0.16"
mime_guess = "2"
lofty = { version = "0.22", features = ["mp3", "flac", "wav", "mp4", "vorbis"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
sysinfo = "0.32"
dirs = "5"
specta = { version = "2", features = ["tauri"] }
tauri-specta = "2"

[features]
default = []
